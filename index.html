<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM Suite — Plataforma SaaS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0efe9;color:#1a1a1a;font-size:13px}
:root{
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-d:#0C447C;
  --green:#3B6D11;--green-l:#EAF3DE;
  --amber:#854F0B;--amber-l:#FAEEDA;
  --red:#A32D2D;--red-l:#FCEBEB;
  --purple:#534AB7;--purple-l:#EEEDFE;
  --gray:#5F5E5A;--gray-l:#F1EFE8;
  --border:#e0ddd5;--bg:#fff;--bg2:#f7f6f2;--bg3:#f0efe9
}
input,select,textarea{width:100%;padding:8px 11px;border-radius:7px;border:1px solid var(--border);background:var(--bg);font-size:13px;color:#1a1a1a;font-family:inherit;box-sizing:border-box;transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #185FA520}
button{cursor:pointer;font-family:inherit;font-size:13px;border-radius:7px;padding:8px 16px;border:1px solid var(--border);background:var(--bg);color:#1a1a1a;transition:all .15s}
button:hover{background:var(--bg2)}
.btn-p{background:var(--blue)!important;color:#c8dff5!important;border-color:var(--blue-d)!important;font-weight:600}
.btn-p:hover{background:var(--blue-d)!important}
.btn-sm{padding:3px 9px;font-size:11px;border-radius:5px}
.btn-danger{color:var(--red)!important;border-color:#f0959580!important}
.btn-green{color:var(--green)!important;border-color:#c0dd9780!important}
.btn-amber{color:var(--amber)!important;border-color:#fac77580!important}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:11px;color:var(--gray);padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2)}
td{padding:8px 8px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.5px}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10.5px;font-weight:500}
.card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:300;overflow-y:auto;padding:20px}
.modal{background:var(--bg);border-radius:14px;padding:28px;width:700px;max-width:98vw;border:1px solid var(--border);margin:auto}
.modal-sm{width:500px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{font-size:11px;color:var(--gray);display:block;margin-bottom:5px;font-weight:500}
.section-title{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;padding:12px 0 8px;border-bottom:1px solid var(--border);margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:10px;font-size:10.5px;font-weight:500}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.industry-card{border:2px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;text-align:center}
.industry-card:hover{border-color:var(--blue);background:var(--blue-l)}
.industry-card.selected{border-color:var(--blue);background:var(--blue-l)}
.format-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:11.5px;margin:3px;border:1px solid var(--border);background:var(--bg2)}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:6px;text-align:left;margin-bottom:2px;border:none;background:transparent;color:var(--gray);cursor:pointer;font-size:12.5px;font-family:inherit;transition:background .1s}
.nav-item:hover{background:var(--bg2)}
.nav-item.active{background:var(--bg2);color:#1a1a1a;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>

    ],

// TIPOS DE REGISTRO (campos específicos)
const TIPOS_REGISTRO = {
  temperatura:{label:'Control de temperatura',icon:'🌡',color:'#185FA5',
    camposFijos:[{k:'equipo',l:'Equipo / Área'},{k:'rangoMin',l:'Temp. mínima (°C)'},{k:'rangoMax',l:'Temp. máxima (°C)'},{k:'frecuencia',l:'Frecuencia de lectura'},{k:'instrumento',l:'Instrumento de medición'}],

const FRECUENCIAS = ['Cada hora','Cada 2 horas','Cada 4 horas','Por turno','Al ingreso de turno','Diario','Por lote','Por evento','Semanal','Mensual'];

// ============================================================
// PERSISTENCIA
// ============================================================
const K = {
  tenants: 'bpm_saas_tenants',
  session: 'bpm_saas_session',
  formatos: 'bpm_saas_formatos',
};

const store = {
  getTenants: () => { try { return JSON.parse(localStorage.getItem(K.tenants)||'{}'); } catch(e){ return {}; }},
  saveTenants: (t) => localStorage.setItem(K.tenants, JSON.stringify(t)),
  getSession: () => { try { return JSON.parse(localStorage.getItem(K.session)||'null'); } catch(e){ return null; }},
  saveSession: (s) => localStorage.setItem(K.session, JSON.stringify(s)),
  getFormatos: (tid) => { try { const all=JSON.parse(localStorage.getItem(K.formatos)||'{}'); return all[tid]||{}; } catch(e){ return {}; }},
  saveFormatos: (tid, f) => {
    try { const all=JSON.parse(localStorage.getItem(K.formatos)||'{}'); all[tid]=f; localStorage.setItem(K.formatos,JSON.stringify(all)); } catch(e){}
  },
};

// ============================================================
// STATE
// ============================================================
let S = {
  screen: 'landing',  // landing | register | app
  wizard: { step: 1, empresa: {}, industria: null, areas: [], adminUser: {} },
  session: null,      // { tenantId, userId }
  tenant: null,       // tenant data object
  user: null,         // user object
  view: 'dashboard',
  modal: null,
  formatos: {},
  iaOpen: false,
  iaMessages: [{role:'assistant',content:'¡Hola! Soy tu asistente BPM con IA. Puedo generar documentos, analizar cumplimiento, sugerir mejoras y responder sobre normativa BPM. ¿En qué te ayudo?'}],
};

function go(patch) { Object.assign(S, patch); render(); }

// On load, check session
const savedSession = store.getSession();
if (savedSession) {
  const tenants = store.getTenants();
  const tenant = tenants[savedSession.tenantId];
  if (tenant) {
    const user = tenant.users.find(u => u.id === savedSession.userId);
    if (user && user.activo) {
      S.session = savedSession;
      S.tenant = tenant;
      S.user = user;
      S.formatos = store.getFormatos(savedSession.tenantId);
      S.screen = 'app';
      S.view = user.rol === 'operario' ? 'registros' : 'dashboard';
    }
  }
}

// ============================================================

// ============================================================

  aprobado:  {l:'Aprobado',     bg:'var(--green-l)',  c:'var(--green)'},

};

  supervisor: {l:'Supervisor',    bg:'var(--purple-l)', c:'var(--purple)'},
  operario:   {l:'Operario',      bg:'var(--green-l)',  c:'var(--green)'},
  auditor:    {l:'Auditor',       bg:'var(--amber-l)',  c:'var(--amber)'},
};
const pill = (cfg, l) => `<span class="pill" style="background:${cfg.bg||cfg.bg};color:${cfg.c||cfg.c}">${l||cfg.l}</span>`;
const uid = () => 'x'+Date.now()+Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);

// ============================================================
// RENDER
// ============================================================
function render() {
  document.getElementById('app').innerHTML =
    S.screen === 'landing' ? buildLanding() :
    S.screen === 'register' ? buildWizard() :
    buildApp();
  attachEvents();
}

// ============================================================
// LANDING
// ============================================================
function buildLanding() {
  const tenants = store.getTenants();
  const count = Object.keys(tenants).length;
  return `
<div style="min-height:100vh;background:linear-gradient(135deg,#0C447C 0%,#185FA5 50%,#1a7a6e 100%);display:flex;flex-direction:column">
  <nav style="padding:16px 40px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;font-weight:700">B</div>

    <div style="display:flex;gap:10px">

  </nav>

    <div style="max-width:680px">
      <div style="font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px">Plataforma SaaS · Multitenant</div>
      <h1 style="font-size:42px;font-weight:800;color:white;line-height:1.15;margin-bottom:16px;letter-spacing:-.02em">Gestión de BPM<br>para la industria</h1>
      <p style="font-size:16px;color:rgba(255,255,255,.75);line-height:1.6;margin-bottom:32px">Registros, documentos, auditorías y no conformidades preconfigurados según tu tipo de industria. Listo para usar en minutos.</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:40px">
        <button onclick="goRegister()" style="background:white;border:none;color:var(--blue);font-weight:700;padding:12px 28px;font-size:14px;border-radius:8px">Comenzar gratis →</button>
        ${count>0?`<button onclick="goLogin()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;padding:12px 28px;font-size:14px;border-radius:8px">Ya tengo cuenta</button>`:''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:500px;margin:0 auto">
        ${Object.entries(INDUSTRIAS).map(([k,v])=>`<div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:12px 8px;text-align:center">
          <div style="font-size:22px;margin-bottom:4px">${v.icon}</div>
          <div style="font-size:10px;color:rgba(255,255,255,.8);font-weight:500;line-height:1.3">${v.label}</div>
        </div>`).join('')}
      </div>
      ${count>0?`<div style="margin-top:20px;font-size:12px;color:rgba(255,255,255,.5)">${count} empresa${count>1?'s':''} registrada${count>1?'s':''} en esta instalación</div>`:''}
    </div>
  </div>
</div>`;
}

// ============================================================
// WIZARD DE REGISTRO
// ============================================================
function buildWizard() {
  const w = S.wizard;
  const steps = ['Empresa','Industria','Áreas y turnos','Administrador','Confirmar'];
  return `
<div style="min-height:100vh;background:var(--bg3);display:flex;flex-direction:column">
  <nav style="padding:14px 32px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px">
    <div style="width:28px;height:28px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#c8dff5;font-size:13px;font-weight:700">B</div>
    <span style="font-weight:700;font-size:14px">BPM Suite</span>
    <span style="color:var(--border)">·</span>
    <span style="color:var(--gray);font-size:13px">Registro de nueva empresa</span>
    <button onclick="go({screen:'landing'})" style="margin-left:auto;border:none;background:transparent;color:var(--gray);font-size:12px">← Volver al inicio</button>
  </nav>

  <!-- PROGRESS -->
  <div style="background:var(--bg);border-bottom:1px solid var(--border);padding:16px 32px">
    <div style="display:flex;align-items:center;max-width:700px;margin:0 auto">
      ${steps.map((s,i)=>`
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
          <div class="step-dot" style="background:${i+1<w.step?'var(--green)':i+1===w.step?'var(--blue)':'var(--border)'};color:${i+1<=w.step?'white':'var(--gray)'}">
            ${i+1<w.step?'✓':i+1}
          </div>
          <div style="font-size:10px;font-weight:${i+1===w.step?600:400};color:${i+1===w.step?'var(--blue)':i+1<w.step?'var(--green)':'var(--gray)'};text-align:center">${s}</div>
        </div>
        ${i<steps.length-1?`<div style="flex:1;height:2px;background:${i+1<w.step?'var(--green)':'var(--border)'};margin-bottom:18px"></div>`:''}
      `).join('')}
    </div>
  </div>

  <div style="flex:1;display:flex;align-items:flex-start;justify-content:center;padding:32px 20px">
    <div style="width:100%;max-width:680px">
      ${buildWizardStep(w.step)}
    </div>
  </div>
</div>`;
}

    <button onclick="go({wizard:{...S.wizard,step:2}})">← Anterior</button>

  if (step === 4) return `

    <div><label>Confirmar contraseña *</label><input id="w-apw2" type="password" placeholder="Repite la contraseña"></div>

      <div style="font-size:22px;font-weight:700">BPM Suite</div>
      <div style="font-size:12px;color:var(--gray);margin-top:4px">Selecciona tu empresa e ingresa</div>

      ${lista.length === 0 ? `<div style="text-align:center;padding:20px;color:var(--gray)">No hay empresas registradas.<br><button onclick="goRegister()" style="margin-top:12px;color:var(--blue);border:none;background:transparent;text-decoration:underline;cursor:pointer">Registrar empresa</button></div>` : `
      <div style="margin-bottom:16px"><label>Empresa</label>
        <select id="login-tenant" onchange="updateUserList()">
          ${lista.map(t=>`<option value="${t.id}">${t.razonSocial}</option>`).join('')}
        </select>
      </div>
      <div style="margin-bottom:12px"><label>Usuario</label>

      </div>
    </header>
    <main style="flex:1;overflow-y:auto;padding:20px">${buildView()}</main>
  </div>
</div>
${S.iaOpen?buildIA():''}
${S.modal?buildModal():''}`;
}

function buildView() {
  switch(S.view) {
    case 'dashboard':      return buildDashboard();
    case 'registros':      return buildRegistros();
    case 'documentos':     return buildSimpleTable('documentos');
    case 'auditorias':     return buildSimpleTable('auditorias');
    case 'capacitaciones': return buildSimpleTable('capacitaciones');
    case 'noconformidades':return buildSimpleTable('noconformidades');
    case 'usuarios':       return buildUsuarios();
    case 'configuracion':  return buildConfiguracion();
    default: return '<p style="color:var(--gray)">Sección no disponible.</p>';
  }
}

function buildDashboard() {
  const t = S.tenant;
  const d = t.data;
  const ind = INDUSTRIAS[t.industria]||{icon:'🏭',label:'Industrial'};
  const regVenc = d.registros.filter(r=>r.estado==='vencido').length;
  const ncOpen = d.noConformidades.filter(n=>n.estado!=='cerrado').length;
  const capOk = d.capacitaciones.filter(c=>c.estado==='al_dia').length;
  const capPct = d.capacitaciones.length?Math.round(capOk/d.capacitaciones.length*100):0;
  const docPct = d.documentos.length?Math.round(d.documentos.filter(d=>d.estado==='al_dia').length/d.documentos.length*100):0;
  const regPct = d.registros.length?Math.round(d.registros.filter(r=>r.estado==='al_dia').length/d.registros.length*100):0;
  const ncPct = d.noConformidades.length?Math.round(d.noConformidades.filter(n=>n.accionCorrectiva&&n.accionCorrectiva.length>0).length/d.noConformidades.length*100):100;
  const gen = Math.round((regPct+docPct+capPct+ncPct)/4);
  const totalUsers = t.users.filter(u=>u.activo).length;
  const bar = (l,pct,color,count) => `<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;font-weight:500">${l}</span><span style="font-size:11px;color:var(--gray)">${count}</span></div>
    <div style="height:5px;border-radius:3px;background:var(--bg3)"><div style="height:100%;border-radius:3px;background:${color};width:${pct}%"></div></div>
  </div>`;
  return `
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px">
  ${[{l:'Cumplimiento BPM',v:`${gen}%`,d:'General del sistema',dc:'var(--green)'},
     {l:'Registros activos',v:d.registros.length,d:`${regVenc} vencidos`,dc:regVenc>0?'var(--red)':'var(--gray)'},
     {l:'No conformidades',v:ncOpen,d:'abiertas',dc:ncOpen>0?'var(--amber)':'var(--green)'},
     {l:'Personal capacitado',v:`${capPct}%`,d:`${d.capacitaciones.length-capOk} pendientes`,dc:capPct<80?'var(--amber)':'var(--gray)'},
     {l:'Usuarios activos',v:totalUsers,d:`${t.users.length} en total`,dc:'var(--gray)'},
  ].map(k=>`<div style="background:var(--bg2);border-radius:8px;padding:12px 14px;border:1px solid var(--border)">
    <div style="font-size:10.5px;color:var(--gray);margin-bottom:4px">${k.l}</div>
    <div style="font-size:22px;font-weight:700">${k.v}</div>
    <div style="font-size:11px;color:${k.dc};margin-top:2px">${k.d}</div>
  </div>`).join('')}
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
  <div class="card">
    <div style="font-weight:600;margin-bottom:14px">Cumplimiento por módulo</div>
    ${bar('Registros BPM',regPct,'#185FA5',d.registros.length+' registros')}
    ${bar('Documentos y SOPs',docPct,'#534AB7',d.documentos.length+' docs')}
    ${bar('Capacitaciones',capPct,'#639922',d.capacitaciones.length+' personas')}
    ${bar('No conformidades c/CAPA',ncPct,'#A32D2D',d.noConformidades.length+' NC')}
  </div>
  <div class="card">
    <div style="font-weight:600;margin-bottom:12px">Información de la empresa</div>
    <div style="margin-bottom:10px;padding:10px 12px;background:var(--bg2);border-radius:8px">
      <div style="font-size:10px;color:var(--gray);margin-bottom:4px">Industria / Norma</div>
      <div style="font-size:13px;font-weight:600">${ind.icon} ${ind.label}</div>
      <div style="font-size:11px;color:var(--gray)">${ind.norma}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
      <div><span style="color:var(--gray)">RUC/NIT:</span> ${t.ruc||'—'}</div>
      <div><span style="color:var(--gray)">País:</span> ${t.pais||'—'}</div>
      <div><span style="color:var(--gray)">Ciudad:</span> ${t.ciudad||'—'}</div>
      <div><span style="color:var(--gray)">Turnos:</span> ${t.nTurnos||1} turno(s)</div>
    </div>
    <div style="margin-top:12px">
      <div style="font-size:11px;color:var(--gray);margin-bottom:6px;font-weight:600">Áreas de la empresa:</div>
      <div>${(t.areas||[]).map(a=>`<span style="display:inline-block;padding:2px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:11px;margin:2px">${a}</span>`).join('')}</div>
    </div>
  </div>
</div>
<div class="card">
  <div style="font-weight:600;margin-bottom:12px">Usuarios del sistema</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
    ${Object.entries(ROL_CFG).map(([k,v])=>`<div style="padding:10px;background:${v.bg};border-radius:8px;text-align:center">
      <div style="font-size:18px;font-weight:700;color:${v.c}">${t.users.filter(u=>u.rol===k&&u.activo).length}</div>
      <div style="font-size:11px;color:${v.c};font-weight:500">${v.l}${t.users.filter(u=>u.rol===k&&u.activo).length!==1?'es':''}</div>

function buildRegistros() {

<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap">

function renderRegistroCards(registros, isEdit) {
  if (!registros.length) return `<div style="text-align:center;color:var(--gray);padding:40px 20px;background:var(--bg);border-radius:10px;border:1px solid var(--border)">
    <div style="font-size:32px;margin-bottom:8px">📋</div>
    <div style="font-weight:600;margin-bottom:4px">No hay registros aún</div>
    <div style="font-size:12px">Los registros fueron preconfigurados según tu industria. Puedes agregar nuevos aquí.</div>
  </div>`;
  return registros.map(r => {
    const tipo = TIPOS_REGISTRO[r.tipo]||{label:'General',icon:'📋',color:'#185FA5'};
    const filas = (S.formatos[r.id]||[]);
    const pendApproval = filas.filter(f=>
      (S.user.rol==='supervisor'&&f.estado==='pendiente')||
      (S.user.rol==='admin'&&(f.estado==='pendiente'||f.estado==='revision'))
    ).length;
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:${tipo.color}18">${tipo.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
            <span style="font-size:10px;font-family:monospace;color:var(--gray)">${r.codigo}</span>
            <span style="font-weight:600;font-size:13.5px">${r.nombre}</span>
            ${pill(ESTADO_CFG[r.estado]||ESTADO_CFG.pendiente)}
            ${pendApproval>0?`<span class="pill" style="background:var(--amber-l);color:var(--amber)">${pendApproval} pendiente${pendApproval>1?'s':''} aprobación</span>`:''}
          </div>
          <div style="display:flex;gap:12px;font-size:12px;color:var(--gray);flex-wrap:wrap;margin-bottom:6px">
            <span>📍 ${r.area}</span>
            <span>🔄 ${r.frecuencia}</span>
            <span>👤 ${r.responsable||'—'}</span>
            <span style="background:${tipo.color}18;color:${tipo.color};padding:1px 8px;border-radius:6px;font-size:11px;font-weight:500">${tipo.label}</span>
          </div>
          <div style="font-size:11px;color:var(--gray)">
            Filas: <strong>${filas.length}</strong> · Aprobadas: <strong style="color:var(--green)">${filas.filter(f=>f.estado==='aprobado').length}</strong> · Pendientes: <strong style="color:var(--amber)">${filas.filter(f=>f.estado==='pendiente').length}</strong>
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
          <button class="btn-sm btn-p" onclick="openFormato('${r.id}')">📋 Ver/Llenar formato</button>
          ${isEdit?`<button class="btn-sm" onclick="openModal({type:'editRegistro',id:'${r.id}'})">Configurar</button>
          <button class="btn-sm btn-danger" onclick="deleteRegistro('${r.id}')">Eliminar</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ============================================================
// FORMATO MODAL (campos fijos + tabla de llenado + aprobación)
// ============================================================
function buildFormatoModal() {
  const rid = S.modal.id;
  const t = S.tenant;
  const reg = t.data.registros.find(r=>r.id===rid);
  if (!reg) return '';
  const tipo = TIPOS_REGISTRO[reg.tipo]||TIPOS_REGISTRO.temperatura;
  const filas = S.formatos[rid]||[];
  const cf = reg.camposFijos||{};
  const u = S.user;
  const canFill = ['operario','supervisor','admin'].includes(u.rol);
  const canReview = u.rol==='supervisor'||u.rol==='admin';
  const canApprove = u.rol==='admin';

  const track = (fila) => {
    const steps = [
      {l:'Operario', done:true, who:fila.operario||''},
      {l:'Supervisor', done:fila.estado==='revision'||fila.estado==='aprobado'||fila.estado==='rechazado', who:fila.revisadoPor||''},
      {l:'Jefe/Admin', done:fila.estado==='aprobado'||fila.estado==='rechazado', who:fila.aprobadoPor||''},
    ];
    return `<div style="display:flex;align-items:center;gap:3px">
      ${steps.map((s,i)=>`
        <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
          <div style="width:20px;height:20px;border-radius:50%;background:${s.done?(fila.estado==='rechazado'&&i===2?'var(--red)':'var(--green)'):'var(--border)'};display:flex;align-items:center;justify-content:center;font-size:9px;color:${s.done?'white':'var(--gray)'}">
            ${s.done?(fila.estado==='rechazado'&&i===2?'✕':'✓'):'○'}
          </div>
          <div style="font-size:8px;color:var(--gray);white-space:nowrap">${s.l}</div>
          ${s.who?`<div style="font-size:8px;color:var(--blue);white-space:nowrap;max-width:55px;overflow:hidden;text-overflow:ellipsis">${s.who.split(' ')[0]}</div>`:''}
        </div>
        ${i<2?`<div style="width:12px;height:2px;background:${s.done?'var(--green)':'var(--border)'};margin-bottom:16px;flex-shrink:0"></div>`:''}
      `).join('')}
    </div>`;
  };

  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" style="width:900px">
    <div style="background:linear-gradient(135deg,${tipo.color},${tipo.color}cc);border-radius:10px 10px 0 0;padding:18px 22px;margin:-28px -28px 20px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:28px">${tipo.icon}</span>
          <div>
            <div style="font-size:9px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.08em">${reg.codigo} · ${tipo.label}</div>
            <div style="font-size:17px;font-weight:700;color:white">${reg.nombre}</div>
            <div style="font-size:11px;color:rgba(255,255,255,.8)">${reg.area} · ${reg.frecuencia}</div>
          </div>
        </div>
        <button onclick="closeModal()" style="background:rgba(255,255,255,.2);border:none;color:white;width:30px;height:30px;border-radius:6px;font-size:18px">×</button>
      </div>
    </div>

    <!-- CAMPOS FIJOS -->
    <div class="section-title">Datos del registro (encabezado del formato)</div>
    <div class="grid3" style="margin-bottom:20px">
      ${tipo.camposFijos.map(f=>`<div>
        <label>${f.l}</label>
        <div style="padding:7px 10px;background:var(--bg2);border-radius:6px;border:1px solid var(--border);font-size:12.5px;font-weight:500;min-height:34px">${cf[f.k]||'<span style="color:var(--gray);font-style:italic">Sin configurar</span>'}</div>
      </div>`).join('')}
    </div>

    <!-- TABLA LLENADO -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="section-title" style="margin:0;border:none;padding:0">Registros de llenado diario <span style="font-size:11px;font-weight:400;text-transform:none;color:var(--gray)">(${filas.length} entradas)</span></div>
      ${canFill?`<button class="btn-sm btn-p" onclick="openModal({type:'newFila',id:'${rid}'})">+ Agregar registro</button>`:''}
    </div>
    ${filas.length===0?`<div style="text-align:center;color:var(--gray);padding:24px;background:var(--bg2);border-radius:8px;margin-bottom:16px">
      No hay registros de llenado. ${canFill?'Haz clic en "+ Agregar registro" para comenzar.':''}
    </div>`:`
    <div style="overflow-x:auto;margin-bottom:16px">
      <table style="min-width:700px">
        <thead><tr>
          ${tipo.columnasLlenado.map(c=>`<th style="min-width:${c.k==='accion'?'160px':'90px'}">${c.l}</th>`).join('')}
          <th style="min-width:140px">Flujo de aprobación</th>
          <th style="min-width:100px">Estado</th>
          <th style="min-width:120px">Acciones</th>
        </tr></thead>
        <tbody>
          ${filas.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).map(fila=>`
          <tr>
            ${tipo.columnasLlenado.map(c=>{
              const v=fila[c.k]||'—';
              const isOk=v==='Sí'||v==='Conforme'||v==='Aceptado'||v==='Operativo';
              const isNo=v==='No'||v==='No conforme'||v==='Rechazado'||v==='Fuera de servicio';
              if(isOk||isNo)return`<td><span style="font-weight:600;color:${isOk?'var(--green)':'var(--red)'}">${v}</span></td>`;
              return`<td style="font-size:12px;max-width:160px">${v}</td>`;
            }).join('')}
            <td>${track(fila)}</td>
            <td>${pill(FILA_CFG[fila.estado]||FILA_CFG.pendiente)}</td>
            <td>
              <div style="display:flex;gap:4px;flex-wrap:wrap">
                ${fila.estado==='pendiente'&&canReview?`<button class="btn-sm btn-amber" onclick="cambiarFila('${rid}','${fila.id}','revision')">Revisar</button>`:''}
                ${fila.estado==='revision'&&canApprove?`<button class="btn-sm btn-green" onclick="cambiarFila('${rid}','${fila.id}','aprobado')">Aprobar</button>`:''}
                ${(fila.estado==='pendiente'||fila.estado==='revision')&&(canReview||canApprove)?`<button class="btn-sm btn-danger" onclick="cambiarFila('${rid}','${fila.id}','rechazado')">Rechazar</button>`:''}
                <button class="btn-sm btn-danger" onclick="deleteFila('${rid}','${fila.id}')">✕</button>
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}
    <div style="display:flex;justify-content:flex-end"><button onclick="closeModal()">Cerrar</button></div>
  </div>
</div>`;
}

function buildUsuarios() {

  const u = S.user;
  return `

function buildSimpleTable(key) {
  const cfg = TBL[key];
  const dataKey = key==='noconformidades'?'noConformidades':key;
  const items = S.tenant.data[dataKey]||[];
  const isEdit = S.user.rol==='admin'||S.user.rol==='supervisor';
  return `<div style="display:flex;gap:8px;margin-bottom:14px">
    <input id="tbl-search" placeholder="Buscar…" style="max-width:260px" oninput="filterTbl('${key}')">
    <div style="flex:1"></div>
    ${isEdit?`<button class="btn-p" onclick="openModal({type:'simpleNew',key:'${key}'})">+ Nuevo ${cfg.title}</button>`:''}
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <table><thead><tr>${cfg.cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead>
    <tbody id="tbl-body">${renderTblRows(key,items,isEdit)}</tbody></table>
  </div>`;
}

function renderTblRows(key,items,isEdit) {
  const cfg=TBL[key];
  if(!items.length)return`<tr><td colspan="20" style="padding:24px;text-align:center;color:var(--gray)">No hay registros</td></tr>`;
  return items.map((it,i)=>`<tr>
    ${cfg.row(it,i,items).map(c=>`<td>${c}</td>`).join('')}
    <td>${isEdit?`<div style="display:flex;gap:5px">
      <button class="btn-sm" onclick="openModal({type:'simpleEdit',key:'${key}',id:'${it.id}'})">Editar</button>
      <button class="btn-sm btn-danger" onclick="deleteTblItem('${key}','${it.id}')">Eliminar</button>
    </div>`:''}</td>
  </tr>`).join('');
}

function buildSimpleModal(isNew) {
  const m=S.modal;
  const cfg=TBL[m.key];
  const dataKey=m.key==='noconformidades'?'noConformidades':m.key;
  const item=isNew?{...cfg.empty}:(S.tenant.data[dataKey].find(x=>x.id===m.id)||{});
  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal modal-sm">
    <div style="font-size:15px;font-weight:700;margin-bottom:16px">${isNew?`Nuevo ${cfg.title}`:`Editar ${cfg.title}`}</div>
    <div class="grid2" style="gap:12px">
      ${cfg.fields.map(f=>`<div${f.span?` style="grid-column:span ${f.span}"`:''}>

        ${f.type==='select'?`<select id="sf-${f.k}">${f.opts.map(o=>{const[v,l]=(o+'').split(':');return`<option value="${v}"${item[f.k]===v?' selected':''}>${l||v}</option>`;}).join('')}</select>`:

      <button onclick="closeModal()">Cancelar</button>
      <button class="btn-p" onclick="saveTblItem('${m.key}','${m.id||''}')">Guardar</button>

</div>`;
}

function buildModal() {
  const m = S.modal;
  if (!m) return '';
  if (m.type==='formato')     return buildFormatoModal();
  if (m.type==='newFila')     return buildNewFilaModal();
  if (m.type==='newRegistro') return buildRegistroModal(true);
  if (m.type==='editRegistro')return buildRegistroModal(false);
  if (m.type==='newUser')     return buildUserModal(true);
  if (m.type==='editUser')    return buildUserModal(false);
  if (m.type==='simpleNew')   return buildSimpleModal(true);
  if (m.type==='simpleEdit')  return buildSimpleModal(false);
  return '';
}

// WIZARD
function selectIndustria(k) { S.wizard.industria=k; go({wizard:{...S.wizard}}); }
function addArea() { S.wizard.areas.push('Nueva área'); go({wizard:{...S.wizard}}); }
function removeArea(i) { S.wizard.areas.splice(i,1); go({wizard:{...S.wizard}}); }
function updateArea(i,v) { S.wizard.areas[i]=v; }

function wizardNext(step) {
  const w = S.wizard;
  if (step===1) {
    const r=document.getElementById('w-razon')?.value.trim();
    if (!r) { alert('La razón social es obligatoria'); return; }
    S.wizard.empresa = {
      razonSocial: r,
      ruc: document.getElementById('w-ruc')?.value.trim(),
      pais: document.getElementById('w-pais')?.value,
      ciudad: document.getElementById('w-ciudad')?.value.trim(),
      direccion: document.getElementById('w-direccion')?.value.trim(),
      telefono: document.getElementById('w-telefono')?.value.trim(),
      email: document.getElementById('w-email')?.value.trim(),
      marca: document.getElementById('w-marca')?.value.trim(),
      empleados: document.getElementById('w-empleados')?.value,
    };
    go({wizard:{...S.wizard, step:2}});
  }
  else if (step===2) {
    if (!w.industria) { alert('Selecciona un tipo de industria'); return; }
    go({wizard:{...S.wizard, step:3}});
  }
  else if (step===3) {
    const ind = INDUSTRIAS[w.industria];
    const areas = w.areas.length ? w.areas : [...ind.areas];
    // Read frecuencias and areas
    const registros = ind.registros.map((r,i)=>({
      ...r,
      frecuencia: document.getElementById('freq-'+i)?.value||r.frecuencia,
      area: document.getElementById('area-'+i)?.value||r.area,
    }));
    S.wizard.areas = areas;
    S.wizard.registrosConfig = registros;
    S.wizard.empresa = {...S.wizard.empresa,
      nTurnos: document.getElementById('w-nTurnos')?.value||'2',
      turno1: document.getElementById('w-t1')?.value,
      turno2: document.getElementById('w-t2')?.value,
    };
    go({wizard:{...S.wizard, step:4}});
  }
  else if (step===4) {
    const nombre=document.getElementById('w-anombre')?.value.trim();
    const usuario=document.getElementById('w-ausuario')?.value.trim();
    const pw=document.getElementById('w-apw')?.value;
    const pw2=document.getElementById('w-apw2')?.value;
    if(!nombre||!usuario||!pw){alert('Nombre, usuario y contraseña son obligatorios');return;}
    if(pw!==pw2){alert('Las contraseñas no coinciden');return;}
    if(pw.length<6){alert('La contraseña debe tener al menos 6 caracteres');return;}
    S.wizard.adminUser={
      nombre, usuario, pw,
      cargo: document.getElementById('w-acargo')?.value.trim(),
      email: document.getElementById('w-aemail')?.value.trim(),
      area: document.getElementById('w-aarea')?.value,
      telefono: document.getElementById('w-atel')?.value.trim(),
    };
    go({wizard:{...S.wizard, step:5}});
  }
}

function createTenant() {
  const w = S.wizard;
  const ind = INDUSTRIAS[w.industria];
  const tenantId = uid();
  const adminId = uid();
  // Build registros preconfigurados
  const registros = (w.registrosConfig||ind.registros).map((r,i)=>({
    id: uid(),
    codigo: `REG-${String(i+1).padStart(3,'0')}`,
    nombre: r.nombre,
    area: r.area,
    frecuencia: r.frecuencia,
    responsable: w.adminUser.nombre,
    tipo: r.tipo,
    estado: 'pendiente',
    ultimoRegistro: '',
    camposFijos: {},
  }));
  // Build documentos preconfigurados
  const documentos = ind.docs.map((d,i)=>({
    id: uid(),
    codigo: `SOP-${String(i+1).padStart(3,'0')}`,
    titulo: d,
    tipo: d.toLowerCase().includes('manual')?'Manual':d.toLowerCase().includes('política')||d.toLowerCase().includes('politica')?'Política':'SOP',
    version: 'v1.0',
    vigencia: `${new Date().getFullYear()+1}-12`,
    aprobadoPor: w.adminUser.nombre,
    estado: 'al_dia',
  }));
  const tenant = {
    id: tenantId,
    razonSocial: w.empresa.razonSocial,
    ruc: w.empresa.ruc,
    pais: w.empresa.pais,
    ciudad: w.empresa.ciudad,
    direccion: w.empresa.direccion,
    telefono: w.empresa.telefono,
    email: w.empresa.email,
    industria: w.industria,
    areas: w.areas,
    nTurnos: w.empresa.nTurnos,
    turno1: w.empresa.turno1,
    turno2: w.empresa.turno2,
    createdAt: new Date().toISOString(),
    users: [{
      id: adminId,
      nombre: w.adminUser.nombre,
      usuario: w.adminUser.usuario,
      pw: w.adminUser.pw,
      rol: 'admin',
      area: w.adminUser.area,
      cargo: w.adminUser.cargo,
      email: w.adminUser.email,
      telefono: w.adminUser.telefono,
      activo: true,
    }],
    data: {
      registros,
      documentos,
      auditorias: [],
      capacitaciones: [],
      noConformidades: [],
    },
  };
  const tenants = store.getTenants();
  tenants[tenantId] = tenant;
  store.saveTenants(tenants);
  const session = {tenantId, userId: adminId};
  store.saveSession(session);
  S.session = session;
  S.tenant = tenant;
  S.user = tenant.users[0];
  S.formatos = {};
  S.screen = 'app';
  S.view = 'dashboard';
  S.loginScreen = false;
  go({});
}

// LOGIN
function updateUserList() {
  const tenantId = document.getElementById('login-tenant')?.value;
  const tenants = store.getTenants();
  const tenant = tenants[tenantId];
  const sel = document.getElementById('login-user');
  if (sel && tenant) {
    sel.innerHTML = tenant.users.filter(u=>u.activo).map(u=>`<option value="${u.id}">${u.nombre} (${ROL_CFG[u.rol]?.l||u.rol})</option>`).join('');
  }
}
function doLogin() {
  const tenantId = document.getElementById('login-tenant')?.value;
  const userId = document.getElementById('login-user')?.value;
  const pw = document.getElementById('login-pw')?.value;
  const tenants = store.getTenants();
  const tenant = tenants[tenantId];
  const user = tenant?.users.find(u=>u.id===userId&&u.activo);
  const err = document.getElementById('login-err');
  if (!user||user.pw!==pw) {
    if(err){err.style.display='block';err.textContent='Contraseña incorrecta';}
    return;
  }
  store.saveSession({tenantId,userId});
  S.tenant=tenant; S.user=user; S.session={tenantId,userId};
  S.formatos=store.getFormatos(tenantId);
  S.loginScreen=false; S.screen='app';
  S.view=user.rol==='operario'?'registros':'dashboard';
  go({});
}
function doLogout() {
  store.saveSession(null);
  S.session=null; S.tenant=null; S.user=null;
  S.screen='landing'; S.loginScreen=false;
  S.iaMessages=[{role:'assistant',content:'¡Hola! Soy tu asistente BPM con IA. ¿En qué te ayudo?'}];
  go({});
}

// APP ACTIONS
function saveTenant() {
  const tenants=store.getTenants();
  tenants[S.session.tenantId]=S.tenant;
  store.saveTenants(tenants);
}
function filterRegistros() {
  const q=document.getElementById('reg-search')?.value.toLowerCase()||'';
  const tipo=document.getElementById('reg-tipo')?.value||'';
  const items=S.tenant.data.registros.filter(r=>(!q||(r.nombre+r.area+r.codigo).toLowerCase().includes(q))&&(!tipo||r.tipo===tipo));
  const isEdit=S.user.rol==='admin'||S.user.rol==='supervisor';
  const el=document.getElementById('reg-list');
  if(el)el.innerHTML=renderRegistroCards(items,isEdit);
}
function openFormato(rid) { go({modal:{type:'formato',id:rid}}); }
function saveRegistro(isNew,rid) {
  const codigo=document.getElementById('rc-codigo')?.value.trim();
  const nombre=document.getElementById('rc-nombre')?.value.trim();
  if(!codigo||!nombre){alert('Código y nombre son obligatorios');return;}
  const tipoKey=document.getElementById('rc-tipo')?.value||'temperatura';
  const tipo=TIPOS_REGISTRO[tipoKey];
  const camposFijos={};
  tipo.camposFijos.forEach(f=>{const el=document.getElementById('cf-'+f.k);if(el)camposFijos[f.k]=el.value;});
  const reg={
    id:isNew?uid():rid, codigo, nombre,
    area:document.getElementById('rc-area')?.value||'',
    frecuencia:document.getElementById('rc-frecuencia')?.value||'Diario',
    responsable:document.getElementById('rc-responsable')?.value||'',
    estado:document.getElementById('rc-estado')?.value||'pendiente',
    tipo:tipoKey, camposFijos, ultimoRegistro:today(),
  };
  if(isNew) S.tenant.data.registros.push(reg);
  else S.tenant.data.registros=S.tenant.data.registros.map(r=>r.id===rid?{...r,...reg}:r);
  saveTenant(); go({modal:null,view:'registros'});
}
function deleteRegistro(rid) {
  if(!confirm('¿Eliminar este registro y sus datos?'))return;
  S.tenant.data.registros=S.tenant.data.registros.filter(r=>r.id!==rid);
  const f={...S.formatos}; delete f[rid]; S.formatos=f;
  saveTenant(); store.saveFormatos(S.session.tenantId,f); go({});
}
function updateCamposFijos(tipoKey) {
  const tipo=TIPOS_REGISTRO[tipoKey]||TIPOS_REGISTRO.temperatura;
  const el=document.getElementById('campos-fijos');
  if(el) el.innerHTML=tipo.camposFijos.map(f=>`<div><label>${f.l}</label><input id="cf-${f.k}"></div>`).join('');
}
function saveFila(rid) {
  const reg=S.tenant.data.registros.find(r=>r.id===rid);
  if(!reg)return;
  const tipo=TIPOS_REGISTRO[reg.tipo]||TIPOS_REGISTRO.temperatura;
  const fila={id:uid(),estado:'pendiente',revisadoPor:'',aprobadoPor:''};
  tipo.columnasLlenado.forEach(c=>{const el=document.getElementById('nf-'+c.k);fila[c.k]=el?el.value:'';});
  const f={...S.formatos,[rid]:[...(S.formatos[rid]||[]),fila]};
  S.formatos=f; store.saveFormatos(S.session.tenantId,f);
  // Update ultimoRegistro
  S.tenant.data.registros=S.tenant.data.registros.map(r=>r.id===rid?{...r,ultimoRegistro:fila.fecha||today(),estado:'al_dia'}:r);
  saveTenant(); go({modal:{type:'formato',id:rid}});
}
function deleteFila(rid,fid) {
  if(!confirm('¿Eliminar esta fila?'))return;
  const f={...S.formatos,[rid]:(S.formatos[rid]||[]).filter(f=>f.id!==fid)};
  S.formatos=f; store.saveFormatos(S.session.tenantId,f);
  go({modal:{type:'formato',id:rid}});
}
function cambiarFila(rid,fid,nuevoEstado) {
  const quien=S.user.nombre;
  const f={...S.formatos,[rid]:(S.formatos[rid]||[]).map(f=>{
    if(f.id!==fid)return f;
    const u={...f,estado:nuevoEstado};
    if(nuevoEstado==='revision')u.revisadoPor=quien;
    if(nuevoEstado==='aprobado'||nuevoEstado==='rechazado')u.aprobadoPor=quien;
    return u;
  })};
  S.formatos=f; store.saveFormatos(S.session.tenantId,f);
  go({modal:{type:'formato',id:rid}});
}
function filterUsers(q) {
  const users=S.tenant.users.filter(u=>!q||u.nombre.toLowerCase().includes(q)||u.usuario.toLowerCase().includes(q));
  const el=document.getElementById('users-body');
  if(el)el.innerHTML=renderUserRows(users);
}
function saveUser(userId) {
  const nombre=document.getElementById('uf-nombre')?.value.trim();
  const usuario=document.getElementById('uf-usuario')?.value.trim();
  const pw=document.getElementById('uf-pw')?.value;
  const rol=document.getElementById('uf-rol')?.value;
  const area=document.getElementById('uf-area')?.value;
  const cargo=document.getElementById('uf-cargo')?.value.trim();
  const email=document.getElementById('uf-email')?.value.trim();
  const telefono=document.getElementById('uf-tel')?.value.trim();
  if(!nombre||!usuario){alert('Nombre y usuario son obligatorios');return;}
  if(!userId&&!pw){alert('La contraseña es obligatoria para nuevos usuarios');return;}
  if(!userId&&S.tenant.users.find(u=>u.usuario===usuario)){alert('Ese nombre de usuario ya existe');return;}
  if(!userId) S.tenant.users.push({id:uid(),nombre,usuario,pw,rol,area,cargo,email,telefono,activo:true});
  else S.tenant.users=S.tenant.users.map(u=>u.id===userId?{...u,nombre,usuario,rol,area,cargo,email,telefono,...(pw?{pw}:{})}:u);
  saveTenant(); go({modal:null});
}
function toggleUser(uid2) {
  if(uid2===S.user.id){alert('No puedes desactivar tu propia cuenta');return;}
  S.tenant.users=S.tenant.users.map(u=>u.id===uid2?{...u,activo:!u.activo}:u);
  saveTenant(); go({});
}
function deleteUser(uid2) {
  if(uid2===S.user.id){alert('No puedes eliminar tu propia cuenta');return;}
  if(!confirm('¿Eliminar usuario?'))return;
  S.tenant.users=S.tenant.users.filter(u=>u.id!==uid2);
  saveTenant(); go({});
}
function filterTbl(key) {
  const q=document.getElementById('tbl-search')?.value.toLowerCase()||'';
  const dataKey=key==='noconformidades'?'noConformidades':key;
  const items=(S.tenant.data[dataKey]||[]).filter(it=>!q||Object.values(it).join(' ').toLowerCase().includes(q));
  const isEdit=S.user.rol==='admin'||S.user.rol==='supervisor';
  const el=document.getElementById('tbl-body');
  if(el)el.innerHTML=renderTblRows(key,items,isEdit);
}
function saveTblItem(key,itemId) {
  const cfg=TBL[key];
  const dataKey=key==='noconformidades'?'noConformidades':key;
  const item={};
  cfg.fields.forEach(f=>{const el=document.getElementById('sf-'+f.k);item[f.k]=el?el.value:'';});
  if(!itemId){item.id=uid();S.tenant.data[dataKey]=[...S.tenant.data[dataKey],item];}
  else S.tenant.data[dataKey]=S.tenant.data[dataKey].map(x=>x.id===itemId?{...x,...item}:x);
  saveTenant(); go({modal:null});
}
function deleteTblItem(key,itemId) {
  if(!confirm('¿Eliminar?'))return;
  const dataKey=key==='noconformidades'?'noConformidades':key;
  S.tenant.data[dataKey]=S.tenant.data[dataKey].filter(x=>x.id!==itemId);
  saveTenant(); go({});
}
function saveConfig() {
  S.tenant.razonSocial=document.getElementById('cfg-razon')?.value.trim()||S.tenant.razonSocial;
  S.tenant.ruc=document.getElementById('cfg-ruc')?.value.trim();
  S.tenant.pais=document.getElementById('cfg-pais')?.value.trim();
  S.tenant.ciudad=document.getElementById('cfg-ciudad')?.value.trim();
  S.tenant.telefono=document.getElementById('cfg-tel')?.value.trim();
  S.tenant.direccion=document.getElementById('cfg-dir')?.value.trim();
  S.tenant.email=document.getElementById('cfg-email')?.value.trim();
  saveTenant(); alert('Configuración guardada correctamente');
}
function saveTurnos() {
  S.tenant.nTurnos=document.getElementById('cfg-nTurnos')?.value;
  S.tenant.turno1=document.getElementById('cfg-t1')?.value;
  S.tenant.turno2=document.getElementById('cfg-t2')?.value;
  S.tenant.turno3=document.getElementById('cfg-t3')?.value;
  saveTenant(); alert('Turnos guardados');
}
function updateCfgArea(i,v){S.tenant.areas[i]=v;}
function addCfgArea(){S.tenant.areas.push('Nueva área');saveTenant();go({});}
function removeCfgArea(i){S.tenant.areas.splice(i,1);saveTenant();go({});}
function exportData() {
  const blob=new Blob([JSON.stringify({tenant:S.tenant,formatos:S.formatos},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`bpm-${S.tenant.razonSocial.replace(/\s+/g,'-')}-${today()}.json`;a.click();
}

// IA
async function iaSend(text,fromSugg) {
  const inp=document.getElementById('ia-input');
  const q=(text||inp?.value||'').trim();
  if(!q||iaLoading)return;
  if(inp&&!fromSugg)inp.value='';
  S.iaMessages.push({role:'user',content:q});
  iaLoading=true; go({iaOpen:true});
  const t=S.tenant;
  const ind=INDUSTRIAS[t?.industria]||{label:'Industrial',norma:''};
  const system=`Eres experto consultor en BPM para la industria ${ind.label} (${ind.norma}). Asistes a "${t?.razonSocial||'la empresa'}". Responde siempre en español. Sé práctico y específico.
Estado: ${t?.data.registros.length} registros (${t?.data.registros.filter(r=>r.estado==='vencido').length} vencidos), ${t?.data.noConformidades.filter(n=>n.estado!=='cerrado').length} NC abiertas, ${t?.data.capacitaciones.filter(c=>c.estado==='al_dia').length}/${t?.data.capacitaciones.length} capacitaciones al día.`;
  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system,messages:S.iaMessages.map(m=>({role:m.role,content:m.content}))})});
    const json=await res.json();
    S.iaMessages.push({role:'assistant',content:json.content?.[0]?.text||'Sin respuesta.'});
  } catch(e) {
    S.iaMessages.push({role:'assistant',content:'Error de conexión. El asistente IA funciona dentro de claude.ai.'});
  }
  iaLoading=false; go({iaOpen:true});
}

render();
</script>
